<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KitsKingdom - Liverpool FC</title>
    <link rel="stylesheet" href="Liverpool.css">
</head>
<body>
    <header>
        <h1>Liverpool FC - Tenues Officielles</h1>
        <div class="top-bar">
            <label for="currency-select"></label>
            <select id="currency-select">
                <option value="eur">EUR €</option>
                <option value="mad">MAD DH</option>
            </select>
        </div>
    </header>

    <a href="index.php" class="back-home">🏠 Retour à l'accueil</a>

    <div class="container">

        <!-- Tenue 1 -->
        <div class="jersey-card">
            <img src="home_liverpool.jpg" alt="Tenue Liverpool 1">
            <p class="price" data-eur="43">Prix : 43 €</p>
            <button onclick="addToCartAndRedirect('Maillot Liverpool Domicile', 43)">Commander</button>
        </div>

        <!-- Tenue 2 -->
        <div class="jersey-card">
            <img src="awa_liverpool.jpg" alt="Tenue Liverpool 2">
            <p class="price" data-eur="33">Prix : 33 €</p>
            <button onclick="addToCartAndRedirect('Maillot Liverpool Exterieur', 33)">Commander</button>
        </div>

        <!-- Tenue 3 -->
        <div class="jersey-card">
            <img src="third_liverpool.jpg" alt="Tenue Liverpool 3">
            <p class="price" data-eur="35">Prix : 35 €</p>
            <button onclick="addToCartAndRedirect('Maillot Liverpool Third', 35)">Commander</button>
        </div>

    </div>

    <script>
        // Changement de devise
        document.getElementById("currency-select").addEventListener("change", function () {
            const currency = this.value;
            const prices = document.querySelectorAll(".price");
            const rate = 10;

            prices.forEach(price => {
                const eurValue = parseFloat(price.dataset.eur);
                if (currency === "mad") {
                    price.textContent = "Prix : " + (eurValue * rate).toFixed(0) + " DH";
                } else {
                    price.textContent = "Prix : " + eurValue + " €";
                }
            });
        });

        // Ajout au panier + redirection
        function addToCartAndRedirect(name, price) {
            const cart = JSON.parse(localStorage.getItem("cart")) || [];
            const index = cart.findIndex(item => item.name === name);

            if (index !== -1) {
                cart[index].quantity += 1;
            } else {
                cart.push({ name: name, price: price, quantity: 1 });
            }

            localStorage.setItem("cart", JSON.stringify(cart));
            window.location.href = "panier.html";
        }
    </script>
</body>
</html>
