<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KitsKingdom - Manchester United</title>
    <link rel="stylesheet" href="manunited.css">
</head>
<body>

    <header>
        <h1>Manchester United - Tenues Officielles</h1>
        <div class="top-bar">
            <label for="currency-select"></label>
            <select id="currency-select">
                <option value="eur">EUR €</option>
                <option value="mad">MAD DH</option>
            </select>
        </div>
    </header>
    
    <a href="index.php" class="back-home">🏠 Retour à l'accueil</a>

    <div class="container">

        <!-- Tenue 1 -->
        <div class="jersey-card">
            <img src="manunited_home.jpg" alt="Tenue Manchester United 1">
            <p class="price" data-eur="35">Prix : 35 €</p>
            <button onclick="addToCartAndRedirect('Maillot MU Domicile', 35)">Commander</button>
        </div>

        <!-- Tenue 2 -->
        <div class="jersey-card">
            <img src="manunited_away.jpg" alt="Tenue Manchester United 2">
            <p class="price" data-eur="30">Prix : 30 €</p>
            <button onclick="addToCartAndRedirect('Maillot MU Exterieur', 30)">Commander</button>
        </div>

        <!-- Tenue 3 -->
        <div class="jersey-card">
            <img src="manunited_third.jpg" alt="Tenue Manchester United 3">
            <p class="price" data-eur="27">Prix : 27 €</p>
            <button onclick="addToCartAndRedirect('Maillot MU Third', 27)">Commander</button>
        </div>

    </div>

    <script>
        // Gestion du changement de devise
        document.getElementById("currency-select").addEventListener("change", function () {
            const currency = this.value;
            const prices = document.querySelectorAll(".price");
            const rate = 10;
    
            prices.forEach(price => {
                const eurValue = parseFloat(price.dataset.eur);
                if (currency === "mad") {
                    price.textContent = "Prix : " + (eurValue * rate).toFixed(0) + " DH";
                } else {
                    price.textContent = "Prix : " + eurValue + " €";
                }
            });
        });

        // Ajout au panier + redirection
        function addToCartAndRedirect(name, price) {
            const cart = JSON.parse(localStorage.getItem("cart")) || [];
            const index = cart.findIndex(item => item.name === name);

            if (index !== -1) {
                cart[index].quantity += 1;
            } else {
                cart.push({ name: name, price: price, quantity: 1 });
            }

            localStorage.setItem("cart", JSON.stringify(cart));
            window.location.href = "panier.html";
        }
    </script>

</body>
</html>
