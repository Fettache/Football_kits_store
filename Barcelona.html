<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KitsKingdom - FC Barcelone</title>
    <link rel="stylesheet" href="barcelona.css">
</head>
<body>

    <header>
        <h1>FC Barcelone - Tenues Officielles</h1>
        <div class="top-bar">
            <label for="currency-select"></label>
            <select id="currency-select">
                <option value="eur">EUR €</option>
                <option value="mad">MAD DH</option>
            </select>
        </div>
    </header>

    <a href="index.php" class="back-home">🏠 Retour à l'accueil</a>

    <div class="container">
        <!-- Maillot 1 -->
        <div class="jersey-card">
            <img src="home_barca.jpg" alt="Tenue FC Barcelone 1">
            <p class="price" data-eur="45">Prix : 45 €</p>
            <button onclick="addToCartAndRedirect('Maillot FC Barcelone Domicile', 45)">Commander</button>
        </div>

        <!-- Maillot 2 -->
        <div class="jersey-card">
            <img src="away_barca.jpg" alt="Tenue FC Barcelone 2">
            <p class="price" data-eur="43">Prix : 43 €</p>
            <button onclick="addToCartAndRedirect('Maillot FC Barcelone Exterieur', 43)">Commander</button>
        </div>

        <!-- Maillot 3 -->
        <div class="jersey-card">
            <img src="third_barca.jpg" alt="Tenue FC Barcelone 3">
            <p class="price" data-eur="32">Prix : 32 €</p>
            <button onclick="addToCartAndRedirect('Maillot FC Barcelone Third', 32)">Commander</button>
        </div>
    </div>

    <script>
        document.getElementById("currency-select").addEventListener("change", function () {
            const currency = this.value;
            const prices = document.querySelectorAll(".price");
            const rate = 10;

            prices.forEach(price => {
                const eurValue = parseFloat(price.dataset.eur);
                if (currency === "mad") {
                    price.textContent = "Prix : " + (eurValue * rate).toFixed(0) + " DH";
                } else {
                    price.textContent = "Prix : " + eurValue + " €";
                }
            });
        });

        function addToCartAndRedirect(name, price) {
            const cart = JSON.parse(localStorage.getItem("cart")) || [];
            const index = cart.findIndex(item => item.name === name);

            if (index !== -1) {
                cart[index].quantity += 1;
            } else {
                cart.push({ name: name, price: price, quantity: 1 });
            }

            localStorage.setItem("cart", JSON.stringify(cart));
            window.location.href = "panier.html";
        }
    </script>

</body>
</html>
